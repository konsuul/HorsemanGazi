name: Pfert CI/CD

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pfert-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run all Pfert tests
        run: node tests/test-all.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx --no-install playwright install --with-deps chromium
      - name: Check game startup in Chromium
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory Pfert &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:8000/ -o /dev/null
          node tests/browser-smoke.cjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Stamp the published commit
        run: sed -i "/<head>/a\ <meta name=\"pfert-commit\" content=\"$GITHUB_SHA\">" Pfert/index.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: Pfert
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="github-pages-$GITHUB_RUN_ATTEMPT"
          for attempt in {1..12}; do
            sleep 5
            if count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$artifact" --jq .total_count) && [[ "$count" == 1 ]]; then
              exit 0
            fi
          done
          echo "::error::Pages artifact $artifact is not visible in the workflow run"
          exit 1
      - name: Deploy Pages
        uses: actions/deploy-pages@v5.0.1
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify the public game
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/verify-pages.cjs "$PAGE_URL" "$GITHUB_SHA"

  release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package the deployed commit
        id: package
        run: |
          version=$(sed -n 's/.*class="title-version">Version \([0-9]*\.[0-9]*\.[0-9]*\)<.*/\1/p' Pfert/index.html)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid game version in Pfert/index.html"
            exit 1
          fi
          tag="v$version-build.$GITHUB_RUN_NUMBER"
          git archive --format=zip --output="$RUNNER_TEMP/Pfert-$tag.zip" HEAD Pfert/
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish the ZIP and generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          GAME_VERSION: ${{ steps.package.outputs.version }}
        run: |
          filename="Pfert-$RELEASE_TAG.zip"
          if gh release view "$RELEASE_TAG" --json assets,isDraft > "$RUNNER_TEMP/pfert-release.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/pfert-release.json" >/dev/null; then
              jq -e --arg filename "$filename" '.assets | any(.name == $filename)' "$RUNNER_TEMP/pfert-release.json" >/dev/null
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            if ! jq -e --arg filename "$filename" '.assets | any(.name == $filename)' "$RUNNER_TEMP/pfert-release.json" >/dev/null; then
              gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$filename"
            fi
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$filename" --target "$GITHUB_SHA" \
              --generate-notes --latest --title "Pfert $GAME_VERSION (Build $GITHUB_RUN_NUMBER)"
          fi
